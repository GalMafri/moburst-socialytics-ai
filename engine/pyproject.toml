[project]
name = "design-engine"
version = "0.1.0"
description = "Socialytics design engine: brand learner, composer, gate, per-post run"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pillow>=11.0",
  "scikit-image>=0.24",
  "fonttools[woff]>=4.58",
  "rembg[cpu]>=2.0.60",
  "rapidocr-onnxruntime>=1.4",
  "playwright>=1.50",
  "anthropic>=0.60",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["design_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
