name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual runs from the Actions tab

# Avoid overlapping deploys: a newer push cancels an in-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/tools/moburst-socialytics-ai
            # .env is untracked as of Sep 2026 (it only holds public values;
            # vite.config.ts carries fallbacks). The host's own copy is
            # preserved across the pull: back it up, let git reconcile the
            # tracked path, then put it back. A locally edited .env had
            # aborted every pull since Aug 24.
            if [ -f .env ]; then cp .env /tmp/socialytics-env-local; fi
            if git ls-files --error-unmatch .env >/dev/null 2>&1; then
              git --no-pager diff --stat -- .env || true
              git checkout -- .env
            fi
            git fetch --all
            git pull --ff-only origin main
            if [ -f /tmp/socialytics-env-local ]; then cp /tmp/socialytics-env-local .env; fi
            bash deploy.sh
