name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual runs from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    # Only the build is cancellable: a newer push supersedes an in-flight build.
    # The deploy job stays outside this group, because cancelling it mid-run can
    # kill deploy.sh partway through npm ci on the server.
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc -b --force

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

  # Vercel (team "Moburst", vercel.com/moburst-ai), beside the server deploy
  # until socialytics.moburst.com moves there. The Vercel CLI uploads the build
  # with the VERCEL_TOKEN secret (a token of ai@moburst.com), so no Vercel
  # GitHub app is installed on the account that owns this repository. The
  # settings the static server had (SPA fallback, cache headers) are in
  # vercel.json. Until the secret exists the job does nothing.
  vercel:
    needs: build
    runs-on: ubuntu-latest
    # One production deploy at a time, in push order; a newer push waits.
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI: vercel@63.1.2
      VERCEL_SCOPE: moburst-ai
      VERCEL_PROJECT: moburst-socialytics
    steps:
      - name: Checkout
        if: env.VERCEL_TOKEN != ''
        uses: actions/checkout@v4

      - name: Setup Node
        if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          # The project is made on the first run and found on every run after.
          npx --yes "$VERCEL_CLI" project add "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" || true
          npx --yes "$VERCEL_CLI" link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" build --prod --token "$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/tools/moburst-socialytics-ai
            # .env is untracked as of Sep 2026 (it only holds public values;
            # vite.config.ts carries fallbacks). The host's own copy is
            # preserved across the pull: back it up, let git reconcile the
            # tracked path, then put it back. A locally edited .env had
            # aborted every pull since Aug 24.
            if [ -f .env ]; then cp .env /tmp/socialytics-env-local; fi
            if git ls-files --error-unmatch .env >/dev/null 2>&1; then
              git --no-pager diff --stat -- .env || true
              git checkout -- .env
            fi
            git fetch --all
            git pull --ff-only origin main
            if [ -f /tmp/socialytics-env-local ]; then cp /tmp/socialytics-env-local .env; fi
            bash deploy.sh
