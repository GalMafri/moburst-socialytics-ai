name: checks

# The same typecheck, tests and build as deploy.yml, for every branch other
# than main, on GitHub's machines. Nothing is deployed from here: only a push
# to main deploys (deploy.yml). Added 22 Nov 2026 so a fix branch is checked
# in full without running the whole suite on a laptop.

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc -b --force

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build
